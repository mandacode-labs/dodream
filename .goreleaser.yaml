version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: dodream-engine
    main: ./cmd/dodream-engine
    binary: dodream-engine
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.gitCommit={{.Commit}}

archives:
  - id: dodream-engine
    name_template: "dodream-engine_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: false
  prerelease: auto
