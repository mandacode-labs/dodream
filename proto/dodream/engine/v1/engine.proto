syntax = "proto3";

package dodream.engine.v1;

option go_package = "github.com/mandacode-labs/dodream/pkg/proto/engine/v1";

service EngineService {
  rpc GetCardState(GetCardStateRequest) returns (CardStateResponse);
  rpc GetNextCards(GetNextCardsRequest) returns (NextCardsResponse);
}

message GetCardStateRequest {
  string user_id = 1;
  string card_id = 2;
}

message CardStateResponse {
  string state_id = 1;
  string next_review_at = 2;
  double priority_score = 3;
}

message GetNextCardsRequest {
  string user_id = 1;
  string collection_id = 2;
  int32 limit = 3;
}

message NextCardsResponse {
  repeated CardRecommendation cards = 1;
}

message CardRecommendation {
  string card_id = 1;
  double final_score = 2;
  string next_review_at = 3;
}
